name: Acquire Unity Activation File

# Workflow auxiliar para obtener el archivo de activación Unity.
# Se corre UNA SOLA VEZ al inicio del proyecto para conseguir
# el archivo .alf que luego subes a license.unity3d.com, y el .ulf resultante
# se guarda como secret UNITY_LICENSE en el repo.
#
# Disparo manual desde la UI de Actions.

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        uses: game-ci/unity-request-activation-file@v2
        id: getManualLicenseFile

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
