name: Build Windows

# Produces a downloadable Windows installer. Runs on demand and on tags, not on
# every push: a full Tauri build takes minutes and there is nothing to gain from
# doing it on each commit.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `version` input on purpose: the root package.json pins
      # `packageManager`, and specifying both makes this action fail.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            crates/jarvis-fs

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The three suites are independent of each other's toolchains, so a
      # failure here points at exactly one layer.
      - name: Test the engine
        run: python -m pytest engine/tests

      - name: Test the native crate
        run: cargo test --manifest-path crates/jarvis-fs/Cargo.toml

      - name: Test the interface
        run: pnpm --filter @jarvis/desktop test

      - name: Generate icons
        run: python scripts/generate_icons.py

      # Freezing the engine is what lets the installer run on a machine with no
      # Python. The script verifies the binary answers a ping before continuing.
      - name: Freeze the Python engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python scripts/build_sidecar.py --triple x86_64-pc-windows-msvc

      - name: Build the application
        run: pnpm --filter @jarvis/desktop tauri:build

      - name: Collect the installers
        shell: bash
        run: |
          mkdir -p artifacts
          find apps/desktop/src-tauri/target/release/bundle -type f \
            \( -name '*.msi' -o -name '*.exe' \) -exec cp {} artifacts/ \;
          # The portable executable is useful for a quick trial without installing.
          cp "apps/desktop/src-tauri/target/release/JARVIS Knowledge Engine.exe" \
            "artifacts/JARVIS-Knowledge-Engine-portable.exe" || true
          cp apps/desktop/src-tauri/binaries/jarvis-engine-x86_64-pc-windows-msvc.exe \
            artifacts/ || true
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-knowledge-engine-windows
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish a release for tagged builds
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
