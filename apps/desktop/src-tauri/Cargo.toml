[package]
name = "jarvis-desktop"
version = "0.1.0"
description = "JARVIS Knowledge Engine desktop shell"
edition = "2021"
rust-version = "1.77"

# Its own workspace: `crates/jarvis-fs` must stay testable without Tauri's
# system dependencies (webkit2gtk on Linux), so the two do not share a lockfile.
[workspace]

[lib]
name = "jarvis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jarvis-fs = { path = "../../../crates/jarvis-fs" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
