[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-engine"
version = "0.1.0"
description = "Local technical knowledge engine for Oracle, APEX, PL/SQL, MOCA and JasperReports projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JARVIS Knowledge Engine" }]

# The MVP runs on the standard library alone: sqlite3 for persistence, hashlib
# for hashing, xml.etree for markup. No dependency reaches the network, which is
# what lets the packaged app run with no internet at all.
dependencies = []

[project.optional-dependencies]
# Installed only for development; the packaged sidecar ships without them.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
# Reserved for Etapa 2: tree-sitter grammars and a stricter XML parser.
analyzers = [
    "tree-sitter>=0.22",
    "tree-sitter-languages>=1.10",
    "lxml>=5.0",
]

[project.scripts]
jarvis = "jarvis_engine.cli:main"
jarvis-engine-sidecar = "jarvis_engine.ipc.server:main"

[tool.setuptools.packages.find]
include = ["jarvis_engine*"]

[tool.setuptools.package-data]
jarvis_engine = ["persistence/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
